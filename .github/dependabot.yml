version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: swift
    directories:
      - "/"
      - "/Core"
      - "/Renderer"
      - "/Kit"
      - "/Identity"
      - "/Plugins/CmdySDK"
      - "/Plugins/chromium"
      - "/Plugins/chromium/Support"
      - "/Vendor/BraincellBridge"
    schedule:
      interval: monthly
    groups:
      swift-packages:
        patterns:
          - "*"
