name: Notarized macOS artifact
run-name: Release ${{ inputs.version || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.2.0)
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease candidate instead of latest
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      concurrency_scope: release-validation

  release:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate release version before loading repository code or secrets
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if ! [[ "$RELEASE_VERSION_INPUT" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release version must be numeric, for example 1.2.0 or v1.2.0." >&2
            exit 2
          fi
          release_version="${RELEASE_VERSION_INPUT#v}"
          project_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$release_version" != "$project_version" ]; then
            echo "Release $release_version does not match VERSION ($project_version)." >&2
            exit 2
          fi
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"

      - name: Load product identity
        run: |
          source scripts/product-identity.sh
          product_assert_release_repository "$GITHUB_REPOSITORY"
          echo "PRODUCT_SLUG=$PRODUCT_SLUG" >> "$GITHUB_ENV"
          echo "PRODUCT_TITLE_NAME=$PRODUCT_TITLE_NAME" >> "$GITHUB_ENV"

      - name: Refuse a mutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v$RELEASE_VERSION"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; published versions are immutable." >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$release_tag")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "$release_tag points to $tag_commit, not $GITHUB_SHA." >&2
              exit 1
            fi
          fi

      - name: Require approved publication qualification
        run: >-
          python3 -B scripts/check-release-qualification.py publication
          --phase source

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CMDY_DEVELOPER_ID_P12_BASE64 || secrets.TERMITE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CMDY_DEVELOPER_ID_P12_PASSWORD || secrets.TERMITE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          certificate="$RUNNER_TEMP/$PRODUCT_SLUG-developer-id.p12"
          keychain="$RUNNER_TEMP/$PRODUCT_SLUG-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"

      - name: Prepare App Store Connect notary key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.CMDY_NOTARY_KEY_P8_BASE64 || secrets.TERMITE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.CMDY_NOTARY_KEY_ID || secrets.TERMITE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.CMDY_NOTARY_ISSUER_ID || secrets.TERMITE_NOTARY_ISSUER_ID }}
        run: |
          test -n "$NOTARY_KEY_BASE64"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER_ID"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D \
            > "$RUNNER_TEMP/$PRODUCT_SLUG-notary-key.p8"
          chmod 600 "$RUNNER_TEMP/$PRODUCT_SLUG-notary-key.p8"

      - name: Build, notarize, staple, and verify
        env:
          PRODUCT_BUILD_NUMBER: ${{ github.run_number }}
          PRODUCT_BROWSER_EDITION: 0
          PRODUCT_BROWSER_DEFAULT_ENABLED: 0
          PRODUCT_NOTARY_KEY_FILE: ${{ runner.temp }}/${{ env.PRODUCT_SLUG }}-notary-key.p8
          PRODUCT_NOTARY_KEY_ID: ${{ secrets.CMDY_NOTARY_KEY_ID || secrets.TERMITE_NOTARY_KEY_ID }}
          PRODUCT_NOTARY_ISSUER_ID: ${{ secrets.CMDY_NOTARY_ISSUER_ID || secrets.TERMITE_NOTARY_ISSUER_ID }}
        run: |
          export PRODUCT_VERSION="$RELEASE_VERSION"
          ./release.sh

      - name: Build installable Browser component app
        env:
          PRODUCT_BUILD_NUMBER: ${{ github.run_number }}
          PRODUCT_NOTARY_KEY_FILE: ${{ runner.temp }}/${{ env.PRODUCT_SLUG }}-notary-key.p8
          PRODUCT_NOTARY_KEY_ID: ${{ secrets.CMDY_NOTARY_KEY_ID || secrets.TERMITE_NOTARY_KEY_ID }}
          PRODUCT_NOTARY_ISSUER_ID: ${{ secrets.CMDY_NOTARY_ISSUER_ID || secrets.TERMITE_NOTARY_ISSUER_ID }}
        run: |
          export PRODUCT_VERSION="$RELEASE_VERSION"
          ./scripts/release-chromium-browser.sh

      - name: Exercise notarized Browser install and removal
        run: |
          source scripts/product-identity.sh
          browser_version="$(tr -d '[:space:]' < Plugins/chromium/VERSION)"
          architecture="$(lipo -archs "$PRODUCT_APP_BUNDLE/Contents/MacOS/$PRODUCT_EXECUTABLE" | tr ' ' '-')"
          lean_archive="dist/$PRODUCT_RELEASE_PREFIX-$RELEASE_VERSION-macOS-$architecture.zip"
          browser_archive="dist/browser/$PRODUCT_RELEASE_PREFIX-$RELEASE_VERSION-browser-$browser_version-macOS-$architecture.zip"
          test -f "$lean_archive"
          test -f "$browser_archive"
          smoke_root="$(mktemp -d "$RUNNER_TEMP/cmdy-notarized-swap.XXXXXX")"
          trap 'rm -rf -- "$smoke_root"' EXIT
          mkdir -p "$smoke_root/lean" "$smoke_root/browser"
          ditto -x -k "$lean_archive" "$smoke_root/lean"
          ditto -x -k "$browser_archive" "$smoke_root/browser"
          ./scripts/test-browser-component-swap.sh \
            "$smoke_root/lean/$PRODUCT_APP_BUNDLE" \
            "$smoke_root/browser/$PRODUCT_APP_BUNDLE"

      - name: Package Browser activation Extension
        run: ./scripts/package-browser-extension.sh

      - name: Upload notarized artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PRODUCT_SLUG }}-notarized-macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.json
            dist/*.sha256
            dist/browser/*.zip
            dist/browser/*.dmg
            dist/browser/*.sha256
            dist/browser/*.json
            dist/browser-extension/*.cmdyext
            dist/browser-extension/*.sha256
          if-no-files-found: error

      - name: Publish signed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          release_tag="v$RELEASE_VERSION"
          release_options=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
              && [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_options+=(--prerelease)
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$release_tag" "${release_options[@]}" \
              dist/*.zip dist/*.dmg dist/*.sha256 dist/browser/* \
              dist/browser-extension/* \
              dist/*.json \
              --verify-tag \
              --title "$PRODUCT_TITLE_NAME $RELEASE_VERSION" \
              --generate-notes
          else
            gh release create "$release_tag" "${release_options[@]}" \
              dist/*.zip dist/*.dmg dist/*.sha256 dist/browser/* \
              dist/browser-extension/* \
              dist/*.json \
              --target "$GITHUB_SHA" \
              --title "$PRODUCT_TITLE_NAME $RELEASE_VERSION" \
              --generate-notes
          fi

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/$PRODUCT_SLUG-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/$PRODUCT_SLUG-developer-id.p12"
          rm -f "$RUNNER_TEMP/$PRODUCT_SLUG-notary-key.p8"
